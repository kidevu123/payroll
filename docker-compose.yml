# docker compose for the payroll platform.
#
# Three services:
#   app     — the Next.js app + pg-boss worker (one process owns the queue)
#   db      — Postgres 16 with the citext extension installed by the migrator
#   backup  — sidecar that pg_dumps once a day and prunes archives older than 30d
#
# Volumes:
#   pgdata  — Postgres data dir (named volume)
#   /data   — bind-mounted from the host for uploads, payslips, ngteco, backups
#
# All operational behavior lives in /admin/settings; this file only sets up
# infrastructure.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payroll}
      POSTGRES_DB: payroll
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamped at build time; surfaced via milo_build_info gauge.
        BUILD_GIT_SHA: ${BUILD_GIT_SHA:-dev}
        BUILD_GIT_BRANCH: ${BUILD_GIT_BRANCH:-rebuild/foundation}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://payroll:${POSTGRES_PASSWORD:-payroll}@db:5432/payroll
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      NGTECO_VAULT_KEY: ${NGTECO_VAULT_KEY:?NGTECO_VAULT_KEY must be set in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-${APP_URL:-http://localhost:3000}}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-payroll}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      OTEL_PROMETHEUS_PORT: "9464"
      OTEL_PROMETHEUS_HOST: "0.0.0.0"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL:-noreply@example.com}
      STORAGE_ROOT: /data
      NODE_ENV: production
    volumes:
      - ./data:/data
    ports:
      - "${APP_PORT:-3000}:3000"
      # Prometheus scrape endpoint. Map to host so a Prometheus
      # collector running on the LXC (or another host on the LAN)
      # can scrape http://<lx120-ip>:9464/metrics directly.
      - "${OTEL_PROMETHEUS_HOST_PORT:-9464}:9464"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - internal
      - egress

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: payroll
      PGPASSWORD: ${POSTGRES_PASSWORD:-payroll}
      PGDATABASE: payroll
      PGHOST: db
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./data/backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "Backup sidecar starting; retention: ${RETENTION_DAYS}d"
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump --format=custom --file="/backups/payroll-$${ts}.dump" || echo "pg_dump failed at $${ts}"
          # Prune older than RETENTION_DAYS
          find /backups -type f -name 'payroll-*.dump' -mtime +$${RETENTION_DAYS} -delete || true
          # Sleep 24 hours
          sleep 86400
        done
    networks:
      - internal

  # Container metrics for the payroll stack. Exposes /metrics on
  # 8089 (host port) — the Prometheus collector on LXC 112 scrapes
  # `192.168.1.197:8089/metrics` for per-container CPU / memory /
  # network / restart-count series.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: payroll-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    ports:
      - "${CADVISOR_HOST_PORT:-8089}:8080"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  egress:
    driver: bridge
